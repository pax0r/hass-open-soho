name: OpenSOHO
version: "0.1.0"
slug: opensoho
description: Local OpenWrt controller with Home Assistant Ingress
url: https://github.com/pax0r/hass-open-soho
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
backup: cold
backup_exclude:
  - opensoho/pb_migrations
ingress: true
ingress_port: 8091
ingress_stream: true
panel_admin: true
panel_title: OpenSOHO
panel_icon: mdi:router-wireless
ports:
  8090/tcp: 8090
ports_description:
  8090/tcp: OpenWISP agents on your LAN
options:
  shared_secret: ""
  enable_new_devices: false
schema:
  shared_secret: password
  enable_new_devices: bool
