name: Upstream releases

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check published stable releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_upstream.py
